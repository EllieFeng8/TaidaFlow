<!doctype html>
<!--
  taidaflow-wasm-shell: TaidaFlow loading page for the Qt WebAssembly build (w2-058).

  Template of build/<wasm preset>/TaidaFlowApp.html. It replaces the page that Qt generates from
  <Qt>/wasm_singlethread/plugins/platforms/wasm_shell.html (Qt 6.8.3, LicenseRef-Qt-Commercial OR
  GPL-3.0-only); the loading logic (qtLoad, #screen container, the APPNAME / APPEXPORTNAME /
  PRELOAD placeholders) is taken from that file. The loader visual re-creates the "CubeLoader"
  design (loading_page_prompt.md, React/Tailwind) in plain HTML/CSS: no external CSS, JS, fonts
  or network resources.

  App/CMakeLists.txt + App/wasm/apply_wasm_shell.cmake write this page over Qt's at every CMake
  configure of a WebAssembly build, with the placeholder values taken from the page Qt generated.
  Edit this file, then rebuild wasm (scripts\build-wasm.bat; the edit re-runs the configure) and
  deploy (scripts\deploy-web.ps1). Keep the marker
  "taidaflow-wasm-shell" in this comment: the apply script uses it to tell this page from Qt's.

  w1-066: when Qt reports onLoaded the page waits until the app has painted (two animation
  frames + 250 ms), then plays an 800 ms transition (cube spins faster and grows, a glow spreads
  and fades, the loader fades out while #screen fades in from 0.98 scale) and hides the loader.
  prefers-reduced-motion: a 200 ms cross-fade only. Only opacity / transform are animated.

  w2-084: automatic recovery. Whenever the page shows an error (the WebAssembly program aborted
  or exited, an uncaught WebAssembly runtime error, a failed download, no WebAssembly support),
  the red message stays and a second line counts down; the page reloads itself after 10 s at the
  earliest, later when the back-off says so. The back-off is the one of the in-app heartbeat
  watchdog (TaidaFlowContent/components/LinkWatchdog.js, w1-083): same sessionStorage keys
  (taidaflow.autoReload.lastEpochMs / taidaflow.autoReload.streak), first automatic reload at
  once (here: after the 10 s countdown), then at least 60 s / 120 s / 240 s after the previous
  one, never more than 5 min; the watchdog sets the streak back to 0 after 60 s of healthy link.
  The rules are in the "taidaflow-auto-reload" script below (tested with node, no browser:
  App/wasm/tests). The loading visuals and the w1-066 transition are unchanged.
  This file goes through configure_file(@ONLY): never write a word between two at-signs.
-->
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. (Qt wasm_shell.html) -->
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>

    <title>TaidaFlow</title>
    <style>
      /* Qt shell: the html body covers the entire (visual) viewport with no scroll bars. */
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100%; }
      body { background: #0B1527; }
      #screen { width: 100%; height: 100%; }

      /* ---- Loading page (CubeLoader design) ------------------------------------------- */
      #tf-loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 48px;                      /* gap-12 */
        padding: 48px;                  /* p-12 */
        box-sizing: border-box;
        background: #0B1527;            /* App dark theme (the component itself is transparent) */
        perspective: 1200px;            /* .perspective-container */
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      }
      #tf-loader[hidden] { display: none; }

      .tf-scene {                       /* relative w-24 h-24 flex items-center justify-center preserve-3d */
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
      }
      .tf-cube {                        /* relative w-full h-full preserve-3d animate-cube-spin */
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        animation: tf-cube-spin 8s linear infinite;
      }
      .tf-core {                        /* absolute inset-0 m-auto w-8 h-8 bg-white rounded-full blur-md ... */
        position: absolute;
        inset: 0;
        margin: auto;
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        background: #ffffff;
        filter: blur(12px);
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
        animation: tf-pulse-fast 2s ease-in-out infinite;
      }
      .tf-side {                        /* .side-wrapper */
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
      }
      .tf-front  { transform: rotateY(0deg); }
      .tf-back   { transform: rotateY(180deg); }
      .tf-right  { transform: rotateY(90deg); }
      .tf-left   { transform: rotateY(-90deg); }
      .tf-top    { transform: rotateX(90deg); }
      .tf-bottom { transform: rotateX(-90deg); }

      .tf-face {                        /* .face */
        position: absolute;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        border: 2px solid;
        transform: translateZ(48px);    /* resting position = the breathe start frame */
        opacity: 0.8;
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
        animation: tf-breathe 3s ease-in-out infinite;
      }
      .tf-front > .tf-face, .tf-back > .tf-face {       /* bg-cyan-500/10 border-cyan-400 */
        background-color: rgba(6, 182, 212, 0.1);
        border-color: #22d3ee;
        box-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
      }
      .tf-right > .tf-face, .tf-left > .tf-face {       /* bg-purple-500/10 border-purple-400 */
        background-color: rgba(168, 85, 247, 0.1);
        border-color: #c084fc;
        box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
      }
      .tf-top > .tf-face, .tf-bottom > .tf-face {       /* bg-indigo-500/10 border-indigo-400 */
        background-color: rgba(99, 102, 241, 0.1);
        border-color: #818cf8;
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
      }

      .tf-floor {                       /* absolute -bottom-20 w-24 h-8 bg-black/40 blur-xl rounded-[100%] */
        position: absolute;
        bottom: -80px;
        width: 96px;
        height: 32px;
        border-radius: 100%;
        background: rgba(0, 0, 0, 0.4);
        filter: blur(24px);
        animation: tf-shadow-breathe 3s ease-in-out infinite;
      }

      .tf-text {                        /* flex flex-col items-center gap-1 mt-2 */
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-top: 8px;
        max-width: 100%;
        text-align: center;
      }
      .tf-title {                       /* text-sm font-semibold tracking-[0.3em] text-cyan-300 uppercase */
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #67e8f9;
      }
      .tf-status {                      /* text-xs text-slate-400 */
        margin: 0;
        font-size: 12px;
        line-height: 16px;
        color: #94a3b8;
      }
      .tf-status.tf-error { color: #FF5964; }

      /* Failure / exit: the animation stops where it is. */
      #tf-loader.tf-stopped *,
      #tf-loader.tf-stopped *::before,
      #tf-loader.tf-stopped *::after { animation-play-state: paused; }

      @keyframes tf-cube-spin {
        0%   { transform: rotateX(0deg) rotateY(0deg); }
        100% { transform: rotateX(360deg) rotateY(360deg); }
      }
      @keyframes tf-breathe {           /* 48px = half of the 96px cube */
        0%, 100% { transform: translateZ(48px); opacity: 0.8; }
        50%      { transform: translateZ(80px); opacity: 0.4; border-color: rgba(255, 255, 255, 0.8); }
      }
      @keyframes tf-pulse-fast {
        0%, 100% { transform: scale(0.8); opacity: 0.5; }
        50%      { transform: scale(1.2); opacity: 1; }
      }
      @keyframes tf-shadow-breathe {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50%      { transform: scale(1.5); opacity: 0.2; }
      }

      /* ---- Transition loader -> app (w1-066) --------------------------------------------
         JS adds .tf-leaving to #tf-loader and .tf-entering to #screen once the app has painted,
         and removes both (and hides the loader) on animationend of both, or after 1500 ms.
         0-800 ms  .tf-scene grows 1 -> 2.8 (ease-in), .tf-spin adds 540 deg Y / 180 deg X on top
                   of the idle spin (ease-in = the cube accelerates)
         0-800 ms  .tf-flash (radial glow at the cube) 0 -> 0.9 opacity at 280 ms, spreads to 7x
                   and fades to 0
         0-240 ms  title / status text and floor shadow fade out
         0-800 ms  #tf-loader opacity 1 (until 240 ms) -> 0, pointer-events: none throughout
       200-800 ms  #screen opacity 0 -> 1, scale 0.98 -> 1 (ease-out)
         Only opacity / transform; no filter on the Qt canvas. */
      .tf-spin {                        /* extra rotation for the exit, idle = no transform */
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
      }
      .tf-flash {                       /* exit glow, invisible until .tf-leaving */
        position: absolute;
        left: 50%;
        top: 50%;
        width: 160px;
        height: 160px;
        margin: -80px 0 0 -80px;
        border-radius: 50%;
        background: radial-gradient(circle,
                                    rgba(255, 255, 255, 0.95) 0%,
                                    rgba(103, 232, 249, 0.6) 28%,
                                    rgba(129, 140, 248, 0.28) 52%,
                                    rgba(129, 140, 248, 0) 70%);
        opacity: 0;
        transform: scale(0.2);
        pointer-events: none;
      }
      #tf-loader.tf-leaving {
        pointer-events: none;           /* never blocks the app during the fade */
        animation: tf-exit-loader 800ms ease-in-out both;
      }
      #tf-loader.tf-leaving .tf-scene { animation: tf-exit-zoom 800ms cubic-bezier(0.5, 0, 0.75, 0) both; }
      #tf-loader.tf-leaving .tf-spin  { animation: tf-exit-spin 800ms cubic-bezier(0.5, 0, 0.75, 0) both; }
      #tf-loader.tf-leaving .tf-flash { animation: tf-exit-flash 800ms ease-out both; }
      #tf-loader.tf-leaving .tf-text  { animation: tf-exit-text 240ms ease-in both; }
      #tf-loader.tf-leaving .tf-floor { animation: tf-shadow-breathe 3s ease-in-out infinite,
                                                   tf-exit-fade 240ms ease-in both; }
      #screen.tf-entering {
        animation: tf-screen-enter 600ms cubic-bezier(0.2, 0.7, 0.2, 1) 200ms both;
      }

      @keyframes tf-exit-loader {
        0%, 30% { opacity: 1; }
        100%    { opacity: 0; }
      }
      @keyframes tf-exit-zoom {         /* scale3d: the cube's depth grows with it */
        from { transform: scale3d(1, 1, 1); }
        to   { transform: scale3d(2.8, 2.8, 2.8); }
      }
      @keyframes tf-exit-spin {
        from { transform: rotateX(0deg) rotateY(0deg); }
        to   { transform: rotateX(180deg) rotateY(540deg); }
      }
      @keyframes tf-exit-flash {
        0%   { opacity: 0;   transform: scale(0.2); }
        35%  { opacity: 0.9; transform: scale(1.6); }
        100% { opacity: 0;   transform: scale(7); }
      }
      @keyframes tf-exit-text {
        to { opacity: 0; transform: translateY(8px); }
      }
      @keyframes tf-exit-fade {
        to { opacity: 0; }
      }
      @keyframes tf-screen-enter {
        from { opacity: 0; transform: scale(0.98); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes tf-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      /* Reduced motion: no animation, the cube is shown still at an angle; the transition is a
         200 ms cross-fade (loader out, app in) without spin, zoom or glow. */
      @media (prefers-reduced-motion: reduce) {
        #tf-loader * { animation: none !important; }
        .tf-cube { transform: rotateX(-25deg) rotateY(35deg); }
        #tf-loader.tf-leaving { animation: tf-exit-fade 200ms ease-out both; }
        #screen.tf-entering { animation: tf-fade-in 200ms ease-out both; }
      }
    </style>
    <noscript>
      <style>
        #tf-loader * { animation-play-state: paused !important; }
        #tf-status { display: none; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="tf-loader">
      <div class="tf-scene" aria-hidden="true">
        <div class="tf-flash"></div>
        <div class="tf-spin">
          <div class="tf-cube">
            <div class="tf-core"></div>
            <div class="tf-side tf-front"><div class="tf-face"></div></div>
            <div class="tf-side tf-back"><div class="tf-face"></div></div>
            <div class="tf-side tf-right"><div class="tf-face"></div></div>
            <div class="tf-side tf-left"><div class="tf-face"></div></div>
            <div class="tf-side tf-top"><div class="tf-face"></div></div>
            <div class="tf-side tf-bottom"><div class="tf-face"></div></div>
          </div>
        </div>
        <div class="tf-floor"></div>
      </div>
      <div class="tf-text">
        <h1 class="tf-title">TAIDAFLOW</h1>
        <p id="tf-status" class="tf-status" role="status" aria-live="polite">系統載入中,首次開啟約需數秒…</p>
        <p id="tf-reload" class="tf-status" aria-live="polite" hidden></p>
        <noscript><p class="tf-status tf-error" role="alert">請啟用 JavaScript 後重新整理頁面。</p></noscript>
      </div>
    </div>
    <div id="screen"></div>

    <script type="text/javascript">
        // ==== taidaflow-auto-reload (w2-084) =========================================================
        // Automatic reload after a crash / load failure. The back-off rules and the sessionStorage
        // keys are those of TaidaFlowContent/components/LinkWatchdog.js (w1-083); App/wasm/tests
        // checks with node that both give the same results. Pure functions + schedule() with every
        // browser dependency passed in (the tests run it with a fake clock and storage).
        var TaidaFlowAutoReload = (function () {
            'use strict';
            // Countdown before a reload after a crash / load failure (the earliest reload).
            var CRASH_RELOAD_AFTER_MS = 10000;
            // Same values as LinkWatchdog.js: 60 s, doubling per consecutive reload, at most 5 min.
            var RELOAD_BACKOFF_BASE_MS = 60000;
            var RELOAD_BACKOFF_MAX_MS = 300000;
            var STORAGE_LAST_RELOAD_KEY = 'taidaflow.autoReload.lastEpochMs';
            var STORAGE_STREAK_KEY = 'taidaflow.autoReload.streak';
            // sessionStorage blocked (the back-off cannot be remembered across reloads): wait one
            // base back-off step instead, so a page that keeps failing reloads at most once a minute.
            var NO_STORAGE_WAIT_MS = RELOAD_BACKOFF_BASE_MS;
            var COUNTDOWN_STEP_MS = 1000;

            // Stored text -> number; missing / invalid -> 0 (LinkWatchdog.js parseStoredNumber).
            function parseStoredNumber(text) {
                var value = Number(text);
                return (text === undefined || text === null || text === '' || !isFinite(value)) ? 0 : value;
            }
            // LinkWatchdog.js reloadGapMs: 0 -> 0, 1 -> 60 s, 2 -> 120 s, 3 -> 240 s, 4+ -> 300 s.
            function reloadGapMs(streak) {
                if (!(streak > 0))
                    return 0;
                var gap = RELOAD_BACKOFF_BASE_MS * Math.pow(2, Math.min(streak, 20) - 1);
                return Math.min(gap, RELOAD_BACKOFF_MAX_MS);
            }
            // LinkWatchdog.js reloadWaitMs (epoch ms; a previous reload "in the future" = just now).
            function reloadWaitMs(nowEpochMs, lastReloadEpochMs, streak) {
                var gap = reloadGapMs(streak);
                if (gap <= 0 || !(lastReloadEpochMs > 0))
                    return 0;
                var elapsed = Math.max(0, nowEpochMs - lastReloadEpochMs);
                return Math.max(0, gap - elapsed);
            }
            // Back-off state as LinkWatchdog.qml loadBackoffState() reads it. storage = sessionStorage
            // or null; any exception (storage blocked) -> available false.
            function readState(storage) {
                try {
                    if (!storage)
                        return { available: false, lastEpochMs: 0, streak: 0 };
                    return {
                        available: true,
                        lastEpochMs: parseStoredNumber(storage.getItem(STORAGE_LAST_RELOAD_KEY)),
                        streak: Math.max(0, Math.floor(parseStoredNumber(storage.getItem(STORAGE_STREAK_KEY))))
                    };
                } catch (e) {
                    return { available: false, lastEpochMs: 0, streak: 0 };
                }
            }
            // As LinkWatchdog.qml recordReload(): last = now, streak + 1. Never throws.
            function recordReload(storage, nowEpochMs, state) {
                try {
                    if (storage) {
                        storage.setItem(STORAGE_LAST_RELOAD_KEY, String(nowEpochMs));
                        storage.setItem(STORAGE_STREAK_KEY, String(state.streak + 1));
                    }
                } catch (e) {
                }
            }
            // Delay (ms) from now to the automatic reload.
            function reloadDelayMs(nowEpochMs, state) {
                var backoff = state.available ? reloadWaitMs(nowEpochMs, state.lastEpochMs, state.streak)
                                              : NO_STORAGE_WAIT_MS;
                return Math.max(CRASH_RELOAD_AFTER_MS, backoff);
            }
            // The WebAssembly program is dead: a wasm trap or an Emscripten abort ("Aborted(...)",
            // thrown as WebAssembly.RuntimeError). Other script errors (a browser extension, a
            // cross-origin "Script error.") do not reload the page.
            function isFatalRuntimeError(error, message) {
                if (error && typeof error === 'object') {
                    if (error.name === 'RuntimeError')
                        return true;
                    if (typeof WebAssembly === 'object' && typeof WebAssembly.RuntimeError === 'function'
                            && error instanceof WebAssembly.RuntimeError)
                        return true;
                }
                var text = message ? String(message)
                                   : (error && typeof error === 'object') ? String(error.message || '')
                                   : String(error || '');
                return /Aborted\(/.test(text) || /^(Uncaught )?RuntimeError\b/.test(text);
            }
            // Starts the countdown and reloads when it ends. env: storage (sessionStorage or null),
            // epochNow() (Date.now), monotonicNow() (performance.now), setTimeout, clearTimeout,
            // reload() (location.reload), onCountdown(secondsLeft) (0 = reloading now).
            // Returns { delayMs, streak, storageAvailable, cancel() }.
            function schedule(env) {
                var state = readState(env.storage);
                var delay = reloadDelayMs(env.epochNow(), state);
                var deadline = env.monotonicNow() + delay;
                var timer = null;
                var done = false;
                var tick = function () {
                    timer = null;
                    if (done)
                        return;
                    var left = deadline - env.monotonicNow();
                    if (left > 0) {
                        env.onCountdown(Math.ceil(left / 1000));
                        timer = env.setTimeout(tick, Math.min(COUNTDOWN_STEP_MS, left));
                        return;
                    }
                    done = true;
                    env.onCountdown(0);
                    recordReload(env.storage, env.epochNow(), readState(env.storage));
                    env.reload();
                };
                tick();
                return {
                    delayMs: delay,
                    streak: state.streak,
                    storageAvailable: state.available,
                    cancel: function () {
                        done = true;
                        if (timer !== null)
                            env.clearTimeout(timer);
                        timer = null;
                    }
                };
            }
            return {
                CRASH_RELOAD_AFTER_MS: CRASH_RELOAD_AFTER_MS,
                RELOAD_BACKOFF_BASE_MS: RELOAD_BACKOFF_BASE_MS,
                RELOAD_BACKOFF_MAX_MS: RELOAD_BACKOFF_MAX_MS,
                STORAGE_LAST_RELOAD_KEY: STORAGE_LAST_RELOAD_KEY,
                STORAGE_STREAK_KEY: STORAGE_STREAK_KEY,
                NO_STORAGE_WAIT_MS: NO_STORAGE_WAIT_MS,
                parseStoredNumber: parseStoredNumber,
                reloadGapMs: reloadGapMs,
                reloadWaitMs: reloadWaitMs,
                readState: readState,
                reloadDelayMs: reloadDelayMs,
                isFatalRuntimeError: isFatalRuntimeError,
                schedule: schedule
            };
        })();
        // ==== end of taidaflow-auto-reload ==========================================================
    </script>

    <script type="text/javascript">
        async function init()
        {
            const loader = document.querySelector('#tf-loader');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#tf-status');
            const scene = document.querySelector('.tf-scene');
            let loaded = false;
            let failed = false;

            const setStatus = (text) => {
                status.classList.remove('tf-error');
                status.textContent = text;
            };

            // ---- Transition loader -> app (w1-066) ------------------------------------------
            // onLoaded comes from Emscripten's onRuntimeInitialized, i.e. BEFORE main() runs: the
            // app has not built its window yet. The transition therefore waits for two animation
            // frames (Qt paints its first frame in a requestAnimationFrame callback queued while
            // main() runs, so the second frame after onLoaded comes after that paint) plus
            // SETTLE_MS for the first QML frames, then plays; RAF_GUARD_MS starts it anyway if no
            // frame comes (hidden tab). FINISH_GUARD_MS ends it even without animationend.
            const SETTLE_MS = 250;
            const RAF_GUARD_MS = 1000;
            const FINISH_GUARD_MS = 1500;
            const ANIMATED = [loader, screen];      // the two elements whose animation ends it
            const END_EVENTS = ['animationend', 'animationcancel'];
            let transition = null;  // { started, timers, rafs, pending, onEnd } while active

            // Back to the page's resting state: no transition class, no inline style. #screen is
            // then fully visible (opacity / transform are only set by .tf-entering).
            const clearTransitionStyles = () => {
                loader.classList.remove('tf-leaving');
                screen.classList.remove('tf-entering');
                for (const el of [loader, screen, scene])
                    el.style.removeProperty('will-change');
            };
            const cancelTransition = () => {
                const t = transition;
                transition = null;
                if (t) {
                    t.timers.forEach(clearTimeout);
                    t.rafs.forEach(cancelAnimationFrame);
                    if (t.onEnd) {
                        for (const el of ANIMATED)
                            for (const type of END_EVENTS)
                                el.removeEventListener(type, t.onEnd);
                    }
                }
                clearTransitionStyles();
            };
            const finishTransition = () => {
                if (failed)
                    return;                 // showError already restored the loader
                loader.hidden = true;       // the app's own screen takes over
                cancelTransition();
            };
            const startTransition = (t) => {
                if (transition !== t || t.started || failed)
                    return;
                t.started = true;
                t.timers.forEach(clearTimeout);
                t.rafs.forEach(cancelAnimationFrame);
                t.timers = [];
                t.rafs = [];

                setStatus('準備完成');
                loader.style.willChange = 'opacity';
                scene.style.willChange = 'transform';
                screen.style.willChange = 'opacity, transform';
                t.pending = new Set(ANIMATED);
                // Bubbled events of the loader's children (text, glow...) have another target.
                t.onEnd = (e) => {
                    if (transition === t && t.pending.delete(e.target) && t.pending.size === 0)
                        finishTransition();
                };
                for (const el of ANIMATED)
                    for (const type of END_EVENTS)
                        el.addEventListener(type, t.onEnd);
                t.timers.push(setTimeout(() => { if (transition === t) finishTransition(); },
                                         FINISH_GUARD_MS));
                loader.classList.add('tf-leaving');
                screen.classList.add('tf-entering');
            };
            const beginTransition = () => {
                const t = { started: false, timers: [], rafs: [], pending: null, onEnd: null };
                transition = t;
                const go = () => {
                    try {
                        startTransition(t);
                    } catch (e) {
                        console.error(e);
                        finishTransition(); // never leave #screen transparent or covered
                    }
                };
                t.rafs.push(requestAnimationFrame(() => {
                    t.rafs.push(requestAnimationFrame(() => {
                        t.timers.push(setTimeout(go, SETTLE_MS));
                    }));
                }));
                t.timers.push(setTimeout(go, RAF_GUARD_MS));
            };

            // ---- Automatic reload (w2-084) ---------------------------------------------------
            // Started once, by the first error shown; the countdown line is under the red message.
            const reloadLine = document.querySelector('#tf-reload');
            let autoReload = null;
            const scheduleAutoReload = () => {
                if (autoReload)
                    return;
                let storage = null;
                try {
                    storage = window.sessionStorage;    // the getter throws when storage is blocked
                } catch (e) {
                    storage = null;
                }
                autoReload = TaidaFlowAutoReload.schedule({
                    storage: storage,
                    epochNow: () => Date.now(),
                    monotonicNow: () => performance.now(),
                    setTimeout: (fn, ms) => setTimeout(fn, ms),
                    clearTimeout: (id) => clearTimeout(id),
                    reload: () => window.location.reload(),
                    onCountdown: (seconds) => {
                        reloadLine.textContent = seconds > 0
                            ? `${seconds} 秒後自動重新整理頁面…`
                            : '正在重新整理頁面…';
                        reloadLine.hidden = false;
                    }
                });
                console.warn('[TaidaFlow] automatic reload in', autoReload.delayMs, 'ms (reloads in a row so far:',
                             autoReload.streak, autoReload.storageAvailable ? ')' : '; sessionStorage unavailable)');
            };

            // Error: stop the animation, keep the title, status in #FF5964; the loader is shown
            // again on top of the app (onExit after the app was running). A running or pending
            // transition is aborted and its classes / inline styles are removed first.
            // w2-084: every error shown also starts the automatic reload.
            const showError = (text) => {
                cancelTransition();
                failed = true;
                status.textContent = text;
                status.classList.add('tf-error');
                loader.classList.add('tf-stopped');
                loader.hidden = false;
                try {
                    scheduleAutoReload();
                } catch (e) {
                    console.error(e);
                }
            };
            const loadFailed = () =>
                showError('無法載入系統,請確認網路連線後重新整理頁面(F5)。');

            // w2-084: an uncaught WebAssembly runtime error (trap, Emscripten abort) outside qtLoad's
            // own reporting (e.g. in an event or timer callback of the running app) also ends the
            // program. Other script errors are ignored here (TaidaFlowAutoReload.isFatalRuntimeError).
            const onFatalRuntimeError = (error, message) => {
                if (!TaidaFlowAutoReload.isFatalRuntimeError(error, message))
                    return;
                if (!loaded)
                    loadFailed();
                else
                    showError('系統發生錯誤,已停止執行,請重新整理頁面(F5)。');
            };
            window.addEventListener('error', (e) => onFatalRuntimeError(e.error, e.message));
            window.addEventListener('unhandledrejection', (e) => onFatalRuntimeError(e.reason, ''));

            if (typeof WebAssembly !== 'object'
                    || typeof WebAssembly.instantiate !== 'function') {
                showError('此瀏覽器不支援本系統,請使用最新版 Chrome 或 Edge。');
                return;
            }

            try {
                setStatus('系統載入中,首次開啟約需數秒…');

                const instance = await qtLoad({
                    // Emscripten runs preRun after TaidaFlowApp.wasm was downloaded and
                    // instantiated, before the Qt runtime starts (qtloader appends its own).
                    preRun: [() => { if (!failed) setStatus('啟動中…'); }],
                    qt: {
                        onLoaded: () => {
                            loaded = true;
                            if (failed)
                                return;
                            // Called inside Emscripten's runtime start: never let it throw.
                            try {
                                beginTransition();
                            } catch (e) {
                                console.error(e);
                                finishTransition();
                            }
                        },
                        onExit: exitData =>
                        {
                            if (!loaded) {
                                loadFailed();       // aborted while downloading / starting
                                return;
                            }
                            showError(exitData.code !== undefined
                                ? `系統已結束(代碼 ${exitData.code}),請重新整理頁面(F5)。`
                                : '系統已結束,請重新整理頁面(F5)。');
                        },
                        entryFunction: window.@APPEXPORTNAME@,
                        containerElements: [screen],
                        @PRELOAD@
                    }
                });
            } catch (e) {
                console.error(e);
                console.error(e && e.stack);
                if (!loaded)
                    loadFailed();
            }
        }
        window.addEventListener('load', init);
    </script>
    <script src="@APPNAME@.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
