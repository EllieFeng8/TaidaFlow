#                                             of the request ($time_iso8601), so a new file starts at
#                                             midnight without restarting or reloading nginx.
#                                             deploy\release\start-taidaflow.ps1 deletes files older than
#                                             config.json log.quiet.keepDays at every start (only this
#                                             exact name pattern). nginx itself never deletes a log.
#   <nginx folder>/logs/ keeps nginx.pid and the error log nginx writes before it has read this file
#   (e.g. "nginx -t" / "nginx -s ..." messages of its start-up); it must stay.
#
# The rules mirror the desktop app's own static mount (Core/core.cpp startHttpServer +
# Core/AppHttpServer): same MIME types, same web file suffix list (anything else -> 404),
# hidden names (".xxx") -> 404, no directory listing, "/" -> 302 /TaidaFlowApp.html,
# Cache-Control no-cache + ETag/Last-Modified revalidation, pre-compressed <file>.gz,
# COOP same-origin / COEP require-corp / CORP same-origin.
#
# Differences to AppHttpServer that cannot be expressed in nginx for Windows:
#   * disable_symlinks is NOT available: nginx.org documents it only for systems with openat()
#     and fstatat() (FreeBSD, Linux, Solaris); nginx 1.30.5 for Windows answers
#     'unknown directive "disable_symlinks"' in nginx -t (evidence w2-050). nginx would follow a
#     symbolic link / junction inside the web root or the export folder. Instead
#     scripts\install-nginx-config.ps1 / nginx-web.ps1 scan both folders (and scripts\deploy-web.ps1
#     the web folder) for reparse points (symbolic links, junctions) and refuse when one is found;
#     in /exports a directory (e.g. a junction named like an export file) is answered 404.
#   * nginx for Windows drops a trailing "." / " " of the request path (Windows file name rules),
#     so /TaidaFlowApp.html. and /TaidaFlowApp.html%20 return that same page (the app answers 404).
#     Nothing outside the web root becomes reachable that way (evidence w2-050).
#   * gzip_static does not compare modification times: a .gz older than its file is still sent.
#     scripts\deploy-web.ps1 always rewrites every .gz together with its file (same mtime).

worker_processes  1;              # nginx for Windows: one worker (select(), no fork)
error_log  "D:/repo/codex/qmlTester/taidaflow/build/verify-release-data/logs/nginx-error.log" warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    server_tokens  off;           # error pages / Server header without the version

    # Access log with the date in its name (w2-065). A variable in the path makes nginx open the file
    # by name when it writes (kept open by open_log_file_cache for up to 60 s), so the name follows the
    # date of each request: at midnight the next line goes to the next day's file. The folder must
    # exist (start-taidaflow.ps1 / install-nginx-config.ps1 create it; the app creates it too).
    map $time_iso8601 $taidaflow_log_date {
        "~^(?<taidaflow_ymd>[0-9]{4}-[0-9]{2}-[0-9]{2})T"  $taidaflow_ymd;
        default                                              "unknown-date";
    }
    access_log           "D:/repo/codex/qmlTester/taidaflow/build/verify-release-data/logs/nginx-access-$taidaflow_log_date.log";
    open_log_file_cache  max=4 inactive=60s valid=60s min_uses=1;

    client_body_temp_path  temp/client_body_temp;
    proxy_temp_path        temp/proxy_temp;
    fastcgi_temp_path      temp/fastcgi_temp;
    uwsgi_temp_path        temp/uwsgi_temp;
    scgi_temp_path         temp/scgi_temp;

    # MIME types = AppHttpServer::mimeTypeForFileName() for the served suffixes.
    types {
        text/html               html;
        text/javascript         js mjs;
        application/wasm        wasm;
        text/css                css;
        application/json        json map;
        image/svg+xml           svg;
        image/png               png;
        image/jpeg              jpg;
        image/x-icon            ico;
        font/ttf                ttf;
        font/otf                otf;
        font/woff               woff;
        font/woff2              woff2;
    }
    default_type   application/octet-stream;
    charset        utf-8;                          # "text/html; charset=utf-8" like the app
    charset_types  text/javascript text/css;      # text/html is always included

    etag               on;
    if_modified_since  before;    # like the app: 304 when the file is not newer than the date
    gzip               off;       # no on-the-fly compression ...
    gzip_static        on;        # ... only the <file>.gz written by scripts\deploy-web.ps1
    gzip_vary          on;        # Vary: Accept-Encoding
    autoindex          off;
    absolute_redirect  off;       # Location: /TaidaFlowApp.html (relative, like the app)
    keepalive_timeout  65;

    # HTML: always revalidate. Other web files: also revalidate (ETag -> 304), so a new build is
    # picked up at once and old/new HTML/JS/WASM never mix. Change the default line to allow
    # longer caching of the other files.
    # Export file name rule, CASE-SENSITIVE: nginx for Windows compiles location regular
    # expressions case-insensitively (caseless file system), so "/exports/X_20260101_000000.CSV"
    # would match the location below; a map regex (~) stays case-sensitive (evidence w2-050).
    map $uri $taidaflow_export_name_ok {
        "~^/exports/[A-Za-z0-9_-]{1,40}_[0-9]{8}_[0-9]{6}\.csv$"  1;
        default                                                     0;
    }

    map $uri $taidaflow_cache_control {
        ~*\.html$  "no-cache";
        default    "no-cache";
    }

    server {
        listen       0.0.0.0:80;
        server_name  _;
        root         "../web";

        # "/" -> the page (the app answers the same).
        location = / {
            add_header  Cache-Control "no-cache" always;
            return      302 /TaidaFlowApp.html;
        }

        # History CSV downloads (w2-050 D7/D8): nginx sends the file itself, straight from the
        # app's export folder - the request never reaches Qt. Only
        # <sessionId>_<yyyyMMdd_HHmmss>.csv directly in that folder is served (the app's own rule,
        # HistoryExport::isValidExportFileName: ^[A-Za-z0-9_-]{1,40}_\d{8}_\d{6}\.csv$);
        # anything else below /exports/ -> 404, no listing. ^~ : the web-file regular expression
        # location below is never tried for /exports/.
        # Large files: the static handler streams from disk in output buffers (no temporary file,
        # nothing collected in memory). Resume: HTTP Range (Accept-Ranges: bytes, 206 +
        # Content-Range), If-Range against the ETag / Last-Modified of the current file (a
        # different ETag -> 200 with the whole file).
        location ^~ /exports/ {
            location ~ "^/exports/(?<taidaflow_export>[A-Za-z0-9_-]{1,40}_[0-9]{8}_[0-9]{6}\.csv)$" {
                alias  "D:/repo/codex/qmlTester/taidaflow/build/verify-release-data/exports/$taidaflow_export";
                # Exact (case-sensitive) name rule, see map $taidaflow_export_name_ok.
                if ($taidaflow_export_name_ok = 0) {
                    return 404;
                }
                # A directory (e.g. a junction named like an export file) is never served.
                if (-d $request_filename) {
                    return 404;
                }
                types         { }
                default_type  "text/csv; charset=utf-8";
                charset       off;
                # Nothing that changes the body may run here, or Range would stop working:
                # no gzip / gzip_static, no proxy, no sub/addition filter (only add_header).
                gzip          off;
                gzip_static   off;
                etag          on;
                # One byte range per request is all a resuming download needs; a request with
                # several ranges is answered 200 with the whole file instead of a multipart
                # response (no multipart/byteranges amplification with many small ranges).
                max_ranges    1;
                add_header  Content-Disposition 'attachment; filename="$taidaflow_export"';
                add_header  Cache-Control "no-store" always;
                add_header  Access-Control-Allow-Origin "*" always;
            }
            return 404;
        }

        # REST API (w2-060, Mango 2026-09-28): everything below /api/ goes unchanged (method,
        # body, query string, headers) to RESTManager in the desktop app, which listens on the
        # loopback address only. The app sends the CORS headers itself (Access-Control-Allow-*,
        # also on the OPTIONS preflight answers); nginx passes them through. No access control
        # (intranet); GET routes read, PUT /api/settings/sensors, /api/settings/frequency and
        # /api/modbus/mode change settings (README "REST API"). When the app / REST API is not
        # running nginx answers 502 (no CORS header on that error page).
        # ^~ : the web-file regular expression location below is never tried for /api/ (a route
        # ending in e.g. ".json" still goes to the app).
        location ^~ /api/ {
            proxy_pass             http://127.0.0.1:18080;
            proxy_http_version     1.1;
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout  5s;
            proxy_send_timeout     60s;
            # the range routes can return many rows (the app answers only when the whole
            # result is ready)
            proxy_read_timeout     120s;
            client_max_body_size   1m;
            add_header             Cache-Control "no-store" always;
        }
        # http://<host>/api/ (exactly) -> the REST status route "/" ({"status": "ok"}).
        location = /api/ {
            proxy_pass             http://127.0.0.1:18080/;
            proxy_http_version     1.1;
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout  5s;
            proxy_read_timeout     30s;
            add_header             Cache-Control "no-store" always;
        }

        # Live synchronisation of the web page (w2-062, Mango A2): WebSocket to the app's Mirror
        # server, which listens on 127.0.0.1 only. Long-lived connection: no buffering, 1 h read /
        # send timeout (the Mirror sends heartbeats; a closed connection reconnects).
        location = /mirror {
            proxy_pass             http://127.0.0.1:18125/mirror;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout  5s;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
            proxy_buffering        off;
        }

        # runtime.json (w2-062, spec section 3): the Mirror port for the page. A static file of the
        # web folder, rewritten by the app at every start - never cached (no-store), never a .gz.
        location = /runtime.json {
            gzip_static  off;
            etag         off;
            if_modified_since off;
            add_header   Cache-Control "no-store" always;
            add_header   Cross-Origin-Opener-Policy "same-origin" always;
            add_header   Cross-Origin-Embedder-Policy "require-corp" always;
            add_header   Cross-Origin-Resource-Policy "same-origin" always;
            try_files    $uri =404;
        }

        # Web files only (same suffix list as the app's static mount); no path segment may
        # start with "." (hidden names). $uri is already decoded and normalized ("..", "//",
        # "\" on Windows) by nginx; a path leaving the root is answered 400 before this point.
        location ~* "^/(?:[^/.][^/]*/)*[^/.][^/]*\.(?:html|js|mjs|wasm|css|json|map|svg|png|jpg|ico|ttf|otf|woff|woff2)$" {
            add_header  Cache-Control $taidaflow_cache_control always;
            add_header  Cross-Origin-Opener-Policy "same-origin" always;
            add_header  Cross-Origin-Embedder-Policy "require-corp" always;
            add_header  Cross-Origin-Resource-Policy "same-origin" always;
            try_files   $uri =404;
        }

        # Everything else (build files such as CMakeCache.txt / build.ninja, *.gz, *.txt,
        # directories, ...) -> 404, no listing.
        location / {
            return 404;
        }
    }
}
