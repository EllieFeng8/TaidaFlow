[Rules]
; TaidaFlow field log mode "quiet" (start-taidaflow.ps1 -AppLog quiet, the default):
; only warnings, errors and fatal messages are written to the app log.
; The app logs every Modbus read at info level (about 15 MB per hour); -AppLog full keeps them.
; Loaded through the QT_LOGGING_CONF environment variable (QLoggingCategory, Qt 6.8).
*.debug=false
*.info=false
